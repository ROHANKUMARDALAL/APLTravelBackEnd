services:
  mongo:
    image: mongo:7
    container_name: apl-travel-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - apl_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apl_mongo_data:
